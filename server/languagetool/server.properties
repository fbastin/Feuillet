# LanguageTool's server settings (server/languagetool/Dockerfile).
# Each language's rules are made once and kept, not again for each check
# (about a second); they are made at the first check of each language, and
# kept until LanguageTool stops (6.6 reads pipelineExpireTimeInSeconds but
# does not use it). One set for each language and list of rules turned off,
# a list server/collab/grammar.js keeps the same, and one more for each
# check of a language at the same moment; 20 to 40 MB each, so at most 30.
pipelineCaching=true
maxPipelinePoolSize=30
cacheSize=2000
# As server/collab/grammar.js bounds them.
maxTextLength=20000
maxCheckTimeMillis=15000
