# LanguageTool's server settings (server/languagetool/Dockerfile).
# Each language's rules are made once and kept, not again for each check
# (about a second); they are made at the first check of each language.
pipelineCaching=true
maxPipelinePoolSize=100
pipelineExpireTimeInSeconds=3600
cacheSize=2000
# As server/collab/grammar.js bounds them.
maxTextLength=20000
maxCheckTimeMillis=15000
