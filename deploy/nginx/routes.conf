# deploy/nginx/routes.conf
# What deploy/apache/feuillet.conf does, for nginx. Installed by
# deploy/install.sh as /etc/nginx/snippets/feuillet.conf, DOMAIN (between @
# signs below) being the server's address, and included in the server block
# of /etc/nginx/sites-available/DOMAIN (deploy/nginx/feuillet.conf). Its
# maps are in /etc/nginx/conf.d/feuillet.conf (deploy/nginx/maps.conf).

root /var/www/@DOMAIN@;
index index.html;
error_page 404 /404.html;

add_header Cache-Control $feuillet_cache_control;

# Scripts, styles and WebAssembly compressed, as Debian's Apache does (nginx
# compresses only HTML unless told).
gzip on;
gzip_types text/css text/javascript application/javascript application/json
           application/wasm image/svg+xml text/plain application/xml;

# Types nginx's list lacks and Apache's has: workers' modules (pdf.js,
# Typst), which browsers run only as JavaScript, sounds and fonts.
location ~ \.(mjs|wav|ttf|otf)$ {
    types {
        text/javascript mjs;
        audio/wav       wav;
        font/ttf        ttf;
        font/otf        otf;
    }
}

# What every route to a server below shares: WebSocket, the client's
# address (the servers limit requests by it), no time limit on an open
# connection or a long compile, project files up to 100 MiB and Git pushes
# up to 512 MiB, passed on as they arrive.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $feuillet_connection_upgrade;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_buffering off;
proxy_request_buffering off;
client_max_body_size 512m;

# Real-time collaboration server (deploy/docker-compose.yml).
location ^~ /collab/ {
    proxy_pass http://127.0.0.1:1234/;
}

# TeX Live compile server (deploy/docker-compose.yml), which has no
# network: through its Unix socket.
location ^~ /texlive/ {
    proxy_pass http://unix:/var/lib/feuillet/texlive-socket/texlive.sock:/;
}

# Where applications such as Claude look for how to sign in to the
# collaboration server's /collab/mcp (server/collab/oauth.js).
location ^~ /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:1234;
}
location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:1234;
}

# « Ouvrir dans Feuillet » links and forms, as Overleaf's /docs
# (server/collab/docs.js).
location ^~ /docs {
    proxy_pass http://127.0.0.1:1234;
}
