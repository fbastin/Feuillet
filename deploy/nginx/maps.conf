# deploy/nginx/maps.conf
# Installed by deploy/install.sh as /etc/nginx/conf.d/feuillet.conf (the
# http block), for deploy/nginx/routes.conf.

# WebSocket connections pass through; other requests close as usual.
map $http_upgrade $feuillet_connection_upgrade {
    default upgrade;
    ''      close;
}

# Files directly in /assets/ carry a content hash (not its subfolders); the
# shell, the service worker and the default settings must always be
# revalidated. Empty: no header.
map $uri $feuillet_cache_control {
    ~^/assets/[^/]+$                                              "public, max-age=31536000, immutable";
    ~(^|/)(index\.html|sw\.js|manifest\.json|userdata[^/]*\.json)$ "no-cache";
    default                                                       "";
}
