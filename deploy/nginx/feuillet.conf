# deploy/nginx/feuillet.conf
# With nginx instead of Apache (deploy/install.sh DOMAIN nginx): installed
# once as /etc/nginx/sites-available/DOMAIN, DOMAIN (between @ signs below)
# being the server's address; certbot --nginx then adds HTTPS to it. Its
# routes are in /etc/nginx/snippets/feuillet.conf (deploy/nginx/routes.conf),
# which install.sh writes again at each run, so that an update reaches them.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    include snippets/feuillet.conf;
}
