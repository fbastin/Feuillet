# deploy/apache/feuillet.slashbin.net.conf
# Installed by deploy/install.sh. certbot --apache copies this virtual host
# into feuillet.slashbin.net-le-ssl.conf (HTTPS) and turns this one into a
# redirect to HTTPS.
<VirtualHost *:80>
    ServerName feuillet.slashbin.net
    ServerAdmin fabian.bastin@gmail.com

    DocumentRoot /var/www/feuillet.slashbin.net
    <Directory /var/www/feuillet.slashbin.net>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Real-time collaboration server (deploy/docker-compose.yml).
    ProxyPass        /collab/ http://127.0.0.1:1234/ upgrade=websocket
    ProxyPassReverse /collab/ http://127.0.0.1:1234/

    # TeX Live compile server (deploy/docker-compose.yml).
    ProxyPass        /texlive/ http://127.0.0.1:7045/ upgrade=websocket
    ProxyPassReverse /texlive/ http://127.0.0.1:7045/

    AddType application/wasm .wasm
    ErrorDocument 404 /404.html

    # Files directly in /assets/ carry a content hash (not its subfolders);
    # the shell, the service worker and the default settings must always be
    # revalidated.
    <LocationMatch "^/assets/[^/]+$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "^(index\.html|sw\.js|manifest\.json|userdata.*\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/feuillet_error.log
    CustomLog ${APACHE_LOG_DIR}/feuillet_access.log combined
</VirtualHost>
