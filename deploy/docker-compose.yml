# deploy/docker-compose.yml
# Feuillet servers, reachable only from this machine; Apache exposes them as
# wss://feuillet.slashbin.net/collab/ and wss://feuillet.slashbin.net/texlive/.
name: feuillet

services:
  collab:
    build: ../server/collab
    container_name: feuillet-collab
    restart: unless-stopped
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      ALLOWED_ORIGINS: "https://feuillet.slashbin.net"
    volumes:
      - collab-data:/data
      - collab-files:/files
      - collab-accounts:/accounts
      - collab-shares:/shares

  # Compiles documents written by anyone who can open Feuillet: each
  # connection under its own uid, bounded in memory, processes and disk, and
  # keeping nothing between runs.
  texlive:
    build: ../server/texlive
    container_name: feuillet-texlive
    restart: unless-stopped
    ports:
      - "127.0.0.1:7045:7045"
    environment:
      ALLOWED_ORIGINS: "https://feuillet.slashbin.net"
      MAX_CONCURRENT: "2"
      COMPILE_TIMEOUT_MS: "180000"
    tmpfs:
      - /work:size=2g,mode=0711
      - /tmp:size=256m
    # What the server needs to run each connection under its own uid and clean
    # up after it; the compiles themselves have no capability.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 4
    pids_limit: 256

volumes:
  collab-data:
  collab-files:
  collab-accounts:
  collab-shares:
