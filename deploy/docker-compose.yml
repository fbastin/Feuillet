# deploy/docker-compose.yml
# Feuillet servers, reachable only from this machine; Apache exposes them as
# wss://feuillet.slashbin.net/collab/ and wss://feuillet.slashbin.net/texlive/,
# the second through a Unix socket in /var/lib/feuillet/texlive-socket, which
# install.sh makes for the group www-data.
name: feuillet

# What the servers write (accounts created and deleted, errors): three
# files of 10 MB at most, the oldest erased first, as the privacy page says.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# What every TeX Live server shares (the latest and other years).
x-texlive-environment: &texlive-environment
  ALLOWED_ORIGINS: "https://feuillet.slashbin.net"
  MAX_CONCURRENT: "2"
  COMPILE_TIMEOUT_MS: "180000"
  SHELL_ESCAPE: "full"
  # Each project's files, by content, so that a project reopened sends only
  # what changed (server/texlive/server.js): files unused for 7 days go, the
  # oldest past 2 GB in all. Only the servers read it, not the compiles.
  FILE_CACHE_DIR: "/file-cache"
  FILE_CACHE_DAYS: "7"
  FILE_CACHE_MB: "2048"

x-texlive: &texlive
  restart: unless-stopped
  logging: *logging
  network_mode: none
  volumes:
    - /var/lib/feuillet/texlive-socket:/socket
    - texlive-file-cache:/file-cache
  tmpfs:
    - /work:size=2g,mode=0711
    - /tmp:size=256m
  # What the server needs to run each connection under its own uid and clean
  # up after it; the compiles themselves have no capability.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  collab:
    build: ../server/collab
    container_name: feuillet-collab
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      ALLOWED_ORIGINS: "https://feuillet.slashbin.net"
      PUBLIC_URL: "https://feuillet.slashbin.net/collab"
      # For assistants (Claude) to compile projects (server/collab/mcp.js),
      # through the TeX Live server's socket.
      TEXLIVE_URL: "ws+unix:///texlive-socket/texlive.sock:/"
      # How the last backup went, for the administration page
      # (deploy/backup.sh, server/collab/admin.js).
      BACKUP_STATUS_DIR: "/backup-status"
      # Grammar and style checking (server/collab/grammar.js).
      GRAMMAR_URL: "http://languagetool:8010"
    # GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET, for "Sign in with GitHub",
    # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, for "Sign in with Google",
    # ORCID_CLIENT_ID and ORCID_CLIENT_SECRET, for "Sign in with ORCID", the
    # email settings and ADMIN_ACCOUNTS (see deploy/README.md); kept out of
    # the repository.
    env_file:
      - path: /etc/feuillet/collab.env
        required: false
    volumes:
      - collab-data:/data
      - collab-files:/files
      - collab-accounts:/accounts
      - collab-shares:/shares
      - collab-history:/history
      - collab-mcp:/mcp
      # The projects' Git repositories (server/collab/git.js).
      - collab-git:/git
      - /var/lib/feuillet/backup-status:/backup-status:ro
      - /var/lib/feuillet/texlive-socket:/texlive-socket
    # The group of the TeX Live socket's directory (www-data).
    group_add:
      - "33"
    # Apache reaches it on the default network; LanguageTool on its own.
    networks:
      - default
      - grammar

  # Compiles documents written by anyone who can open Feuillet: each
  # connection under its own uid, bounded in memory, processes and disk, and
  # keeping nothing between runs but each project's files, a week at most
  # (FILE_CACHE_DIR above). As on Overleaf, documents may run programs
  # (shell escape): the container has no network at all, not even this
  # machine's, and is reached through its Unix socket, in a directory the
  # compiles cannot open. Its server refuses full shell escape if it finds a
  # network. This one is the latest TeX Live; a project may choose another
  # year, whose compiles it passes to that year's server (OTHER_YEARS).
  texlive:
    <<: *texlive
    build: ../server/texlive
    container_name: feuillet-texlive
    environment:
      <<: *texlive-environment
      SOCKET_PATH: "/socket/texlive.sock"
      OTHER_YEARS: "2025=/socket/texlive-2025.sock"
    mem_limit: 4g
    cpus: 4

  # TeX Live 2025, the year arXiv compiles with, for the projects that
  # choose it; the same server, on an image of that year. Another year is a
  # service like this one, named in OTHER_YEARS above (deploy/README.md).
  texlive-2025:
    <<: *texlive
    build:
      context: ../server/texlive
      args:
        TEXLIVE_IMAGE: texlive/texlive:TL2025-historic
    container_name: feuillet-texlive-2025
    environment:
      <<: *texlive-environment
      SOCKET_PATH: "/socket/texlive-2025.sock"
      MAX_CONCURRENT: "1"
    mem_limit: 3g
    cpus: 3

  # Grammar and style checking (server/collab/grammar.js): LanguageTool, on
  # a network of its own with the collaboration server only, without access
  # to the Internet. Documents' paragraphs pass through it: it keeps nothing
  # and writes no logs.
  languagetool:
    build: ../server/languagetool
    container_name: feuillet-languagetool
    restart: unless-stopped
    logging:
      driver: none
    networks:
      - grammar
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128

networks:
  # Without a way out: LanguageTool and the collaboration server only.
  grammar:
    internal: true

volumes:
  collab-data:
  collab-files:
  collab-accounts:
  collab-shares:
  collab-history:
  collab-mcp:
  collab-git:
  texlive-file-cache:
