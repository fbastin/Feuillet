# deploy/docker-compose.yml
# Feuillet collaboration server, reachable only from this machine; Apache
# exposes it as wss://feuillet.slashbin.net/collab/.
name: feuillet

services:
  collab:
    build: ../server/collab
    container_name: feuillet-collab
    restart: unless-stopped
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      ALLOWED_ORIGINS: "https://feuillet.slashbin.net"
    volumes:
      - collab-data:/data

volumes:
  collab-data:
